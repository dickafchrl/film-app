<!DOCTYPE html>
<html>
<head><title>Rekomendasi Film</title></head>
<body>
    <h1 id="katalog-name">Memuat...</h1>
    <h1 id="pemilik-name">Memuat...</h1>
    <h1 id="nim-owner">Memuat...</h1>
    <ul id="items-list"></ul>


    <hr>
    <h3>Tambah judul Baru:</h3>
    <input type="text" id="items-input" placeholder="items...">
    <button onclick="tambahJudul()">Tambah</button>


    <script>
        const API_URL = '/api';


        function loadData() {
            fetch(`${API_URL}/info`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('katalog-name').innerText = data.nama_katalog;
                    document.getElementById('pemilik-name').innerText = data.pemilik;
                    document.getElementById('nim-owner').innerText = data.nim;

                    const list = document.getElementById('items-list');
                    list.innerHTML = '';
                    data.items.forEach(item => {
                        let li = document.createElement('li');
                        li.innerText = item;
                        list.appendChild(li);
                    });
                });
        }


        function tambahJudul() {
            const input = document.getElementById('items-input');
            fetch(`${API_URL}/add-item`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: input.value })
            })
            .then(res => res.json())
            .then(() => {
                input.value = '';
                loadData();
            });
        }
        loadData();
    </script>
</body>
</html>
